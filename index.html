<link rel="stylesheet" href="assets/swiper.min.css">
<style>
:root{
  --ground:#e9edf4;
  --ground-2:#f6f8fb;
  --card:#ffffff;
  --line:#d8e0ed;
  --head:#132455;
  --ink-2:#4f5f80;
  --ink-3:#8593ae;
  --blue-deep:#1d3a7d;
  --blue:#2f6bc0;
  --red:#c8202f;
  --scrim:rgba(246,248,251,.9);
  --shadow:0 2px 8px rgba(19,36,85,.10), 0 18px 46px rgba(19,36,85,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080c17; --ground-2:#0d1322; --card:#121a2e; --line:#26314f;
    --head:#e8eefb; --ink-2:#a2b0cf; --ink-3:#6f7d9e;
    --blue-deep:#8fb8f0; --blue:#6fa2e8; --red:#f0616f;
    --scrim:rgba(10,15,28,.9);
    --shadow:0 2px 8px rgba(0,0,0,.5), 0 18px 46px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#080c17; --ground-2:#0d1322; --card:#121a2e; --line:#26314f;
  --head:#e8eefb; --ink-2:#a2b0cf; --ink-3:#6f7d9e;
  --blue-deep:#8fb8f0; --blue:#6fa2e8; --red:#f0616f;
  --scrim:rgba(10,15,28,.9);
  --shadow:0 2px 8px rgba(0,0,0,.5), 0 18px 46px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--ground); color:var(--head);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 40% at 3% -8%, rgba(200,32,47,.12) 0%, transparent 60%),
    radial-gradient(64% 44% at 103% 106%, rgba(47,107,192,.14) 0%, transparent 58%),
    linear-gradient(162deg, var(--ground-2) 0%, var(--ground) 58%, var(--ground-2) 100%);
}

/* ---------------- deck ---------------- */
.deck{position:relative; z-index:1; width:100%; height:100dvh;}
.deck > .swiper-wrapper > .swiper-slide{
  height:100dvh; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 14px calc(env(safe-area-inset-bottom,0px) + 84px);
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.deck > .swiper-wrapper > .swiper-slide::-webkit-scrollbar{width:6px;}
.deck > .swiper-wrapper > .swiper-slide::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}

.sheet{
  position:relative; flex:none; width:100%; max-width:520px;
  border-radius:14px; overflow:hidden; background:var(--card);
  box-shadow:var(--shadow); line-height:0;
}
.sheet img{display:block; width:100%; height:auto;}

@media (min-width:900px){
  .deck > .swiper-wrapper > .swiper-slide{
    justify-content:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 76px); padding-bottom:100px;
  }
  .sheet{width:auto; max-width:none;}
  .sheet img{width:auto; height:auto; max-height:calc(100dvh - 190px); max-width:92vw;}
}

/* ---------------- tappable game rows ---------------- */
.hotspot{
  position:absolute; left:2%; right:2%;
  appearance:none; border:0; padding:0; margin:0; cursor:pointer;
  background:transparent; border-radius:10px;
  display:flex; align-items:center; justify-content:flex-end;
  -webkit-tap-highlight-color:transparent;
}
.hotspot::before{
  content:""; position:absolute; inset:0; border-radius:10px;
  background:rgba(47,107,192,0); transition:background .18s;
}
.hotspot:hover::before{background:rgba(47,107,192,.10);}
.hotspot:active::before{background:rgba(47,107,192,.20);}
.hotspot:focus-visible{outline:3px solid var(--blue); outline-offset:-3px;}
/* 뱃지는 리플렛 글자가 끝나는 오른쪽 여백(89% 이후)에 자리잡도록
   면 너비에 비례해 잡습니다. 화면 크기가 달라져도 글자를 가리지 않습니다. */
.hotspot .badge{
  position:relative; margin-right:1%;
  width:7.5%; aspect-ratio:1; min-width:16px; max-width:30px;
  border-radius:50%; background:#12151c; color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 5px rgba(0,0,0,.3);
}
.hotspot .badge svg{width:55%; height:55%; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
@media (prefers-reduced-motion: no-preference){
  .hotspot .badge{animation:tapPulse 2.6s ease-in-out infinite;}
  @keyframes tapPulse{0%,72%,100%{transform:scale(1)}80%{transform:scale(1.18)}88%{transform:scale(1)}}
}

.tiphint{
  display:flex; flex:none; align-items:center; gap:7px; align-self:center;
  margin:0 0 10px; padding:8px 15px; border-radius:99px;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  font-size:13px; font-weight:700; color:var(--head); line-height:1.3;
}
.tiphint svg{width:15px; height:15px; flex:none; fill:var(--red);}

/* ---------------- chrome ---------------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:20;
  height:calc(env(safe-area-inset-top,0px) + 50px);
  padding:env(safe-area-inset-top,0px) 16px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--scrim); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.mark{display:flex; align-items:baseline; gap:7px; min-width:0;}
.mark b{font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--red);}
.mark span{font-size:14px; font-weight:800; letter-spacing:-.02em; color:var(--head); white-space:nowrap;}
.bar-right{display:flex; align-items:center; gap:10px;}
.counter{font-size:13px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.counter em{font-style:normal; color:var(--head);}
.iconbtn{
  appearance:none; width:32px; height:32px; border-radius:9px; cursor:pointer; padding:0;
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center;
}
.iconbtn:hover{color:var(--head);}
.iconbtn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
.iconbtn svg{width:16px; height:16px; fill:currentColor;}
.iconbtn .moon{display:none;}
:root[data-theme="dark"] .iconbtn .moon{display:block;}
:root[data-theme="dark"] .iconbtn .sun{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .iconbtn .moon{display:block;}
  :root:not([data-theme="light"]) .iconbtn .sun{display:none;}
}

.rail{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 11px);
  background:var(--scrim); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line); display:flex; gap:6px;
}
.lane{
  flex:1 1 0; min-width:0; appearance:none; border:0; cursor:pointer; font-family:inherit;
  background:transparent; padding:5px 2px 4px; border-radius:9px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.lane .bar{width:100%; height:4px; border-radius:99px; background:var(--line); transition:background .28s, transform .28s;}
.lane .lbl{font-size:11px; font-weight:700; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; transition:color .28s;}
.lane[aria-current="true"] .bar{background:linear-gradient(90deg,var(--blue-deep),var(--red)); transform:scaleY(1.6);}
.lane[aria-current="true"] .lbl{color:var(--head);}
.lane:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
@media (min-width:900px){
  .rail{justify-content:center; gap:10px; padding:10px 20px 13px;}
  .lane{flex:0 1 180px;}
  .lane .lbl{font-size:12px;}
}

.nav{
  position:fixed; top:50%; z-index:20; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; padding:0;
  border:1px solid var(--line); background:var(--card); color:var(--head);
  cursor:pointer; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.nav svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.nav:focus-visible{outline:2px solid var(--blue); outline-offset:3px;}
.nav.is-off{opacity:.28; pointer-events:none;}
.nav.prev{left:18px;} .nav.next{right:18px;}
@media (min-width:900px){ .nav{display:flex;} }

/* ---------------- rule viewer ---------------- */
.viewer{
  position:fixed; inset:0; z-index:60; display:none;
  background:rgba(9,12,20,.96);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.viewer.open{display:block;}
.viewer-top{
  position:absolute; top:0; left:0; right:0; z-index:2;
  height:calc(env(safe-area-inset-top,0px) + 54px);
  padding:env(safe-area-inset-top,0px) 14px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:linear-gradient(180deg, rgba(9,12,20,.92) 40%, transparent);
}
.viewer-title{font-size:15px; font-weight:800; color:#fff; letter-spacing:-.02em;}
.viewer-title small{display:block; font-size:11px; font-weight:600; color:rgba(255,255,255,.55); margin-top:2px; letter-spacing:.04em;}
.closebtn{
  appearance:none; width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer; flex:none;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.closebtn:hover{background:rgba(255,255,255,.2);}
.closebtn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
.closebtn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round;}

.rules{width:100%; height:100dvh;}
.rules .swiper-slide{display:flex; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 66px);}
.rules .swiper-zoom-container{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.rules img{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:12px; display:block;}

.viewer-bottom{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex; align-items:center; justify-content:center; gap:9px;
  background:linear-gradient(0deg, rgba(9,12,20,.92) 40%, transparent);
}
.dot{
  appearance:none; border:0; padding:0; cursor:pointer;
  width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3);
  transition:background .2s, width .2s;
}
.dot[aria-current="true"]{background:#fff; width:22px; border-radius:99px;}
.dot:focus-visible{outline:2px solid #fff; outline-offset:3px;}

.vnav{
  position:absolute; top:50%; z-index:2; transform:translateY(-50%);
  width:42px; height:42px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); color:#fff;
  display:none; align-items:center; justify-content:center;
}
.vnav svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.vnav:hover{background:rgba(255,255,255,.2);}
.vnav.is-off{opacity:.25; pointer-events:none;}
.vnav.prev{left:16px;} .vnav.next{right:16px;}
@media (min-width:900px){ .vnav{display:flex;} }

.zoomhint{
  position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 52px);
  transform:translateX(-50%); z-index:2;
  font-size:11.5px; font-weight:600; color:rgba(255,255,255,.5);
  white-space:nowrap; pointer-events:none;
}
/* 더블탭 확대는 터치 제스처라 마우스 화면에서는 감춥니다 */
@media (min-width:900px){ .zoomhint{display:none;} }
</style>

(function () {
  'use strict';

  /* 게임설명 면의 6개 줄. top/bottom 은 그 면 이미지 높이에 대한 % 입니다. */
  var GAMES = [
    { name: '구루마 컬링',        img: 'images/rule-1.jpg', top: 11.5, bottom: 25.1 },
    { name: '토목철인 3종',       img: 'images/rule-2.jpg', top: 25.1, bottom: 40.2 },
    { name: '구속 측정소',        img: 'images/rule-3.jpg', top: 40.2, bottom: 55.2 },
    { name: '탄성한계 측정실험',  img: 'images/rule-4.jpg', top: 55.2, bottom: 70.3 },
    { name: '홀인원 토공사',      img: 'images/rule-5.jpg', top: 70.3, bottom: 85.3 },
    { name: '인간 항타기',        img: 'images/rule-6.jpg', top: 85.3, bottom: 99.5 }
  ];

  var CHEVRON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

  /* ---------- theme ---------- */
  var THEME_KEY = 'tomok2026-theme';
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* ---------- build the tappable rows ---------- */
  var sheet = document.getElementById('gamesheet');
  GAMES.forEach(function (g, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.top = g.top + '%';
    b.style.height = (g.bottom - g.top) + '%';
    b.setAttribute('aria-label', g.name + ' 룰 보기');
    b.innerHTML = '<span class="badge" aria-hidden="true">' + CHEVRON + '</span>';
    b.addEventListener('click', function () { openViewer(i); });
    sheet.appendChild(b);
  });

  /* ---------- rule slides ---------- */
  var wrap = document.getElementById('rulewrap');
  var dotwrap = document.getElementById('vdots');
  GAMES.forEach(function (g, i) {
    var s = document.createElement('div');
    s.className = 'swiper-slide';
    s.innerHTML =
      '<div class="swiper-zoom-container">' +
      '<img data-src="' + g.img + '" alt="' + g.name + ' 게임 룰 안내" decoding="async">' +
      '</div>';
    wrap.appendChild(s);

    var d = document.createElement('button');
    d.type = 'button';
    d.className = 'dot';
    d.setAttribute('aria-label', g.name);
    d.addEventListener('click', function () { rules.slideTo(i); });
    dotwrap.appendChild(d);
  });
  var dots = [].slice.call(dotwrap.children);

  /* 룰 이미지는 뷰어를 열 때 필요한 것부터 불러옵니다 */
  function loadRule(i) {
    for (var n = i - 1; n <= i + 1; n++) {
      if (n < 0 || n >= GAMES.length) continue;
      var img = wrap.children[n].querySelector('img');
      if (img && !img.src) img.src = img.dataset.src;
    }
  }

  /* ---------- main deck ---------- */
  var lanes = [].slice.call(document.querySelectorAll('.lane'));
  var cur = document.getElementById('cur');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');

  function paintDeck(i) {
    cur.textContent = i + 1;
    lanes.forEach(function (l, n) { l.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    prev.classList.toggle('is-off', i === 0);
    next.classList.toggle('is-off', i === lanes.length - 1);
  }

  var start = 0;
  var m = /^#p([1-4])$/.exec(location.hash);
  if (m) start = +m[1] - 1;

  var deck = new Swiper('#deck', {
    initialSlide: start,
    speed: 440,
    threshold: 10,
    touchAngle: 32,
    touchReleaseOnEdges: true,
    resistanceRatio: 0.55,
    keyboard: { enabled: true, onlyInViewport: false },
    a11y: { enabled: true, containerMessage: '토목체전 리플렛 4면', slideRole: 'group' },
    on: {
      init: function () { paintDeck(this.activeIndex); },
      slideChange: function () { paintDeck(this.activeIndex); }
    }
  });
  deck.on('slideChangeTransitionEnd', function () {
    var el = deck.slides[deck.previousIndex];
    if (el) el.scrollTop = 0;
  });

  lanes.forEach(function (l, i) { l.addEventListener('click', function () { deck.slideTo(i); }); });
  prev.addEventListener('click', function () { deck.slidePrev(); });
  next.addEventListener('click', function () { deck.slideNext(); });

  /* ---------- rule viewer ---------- */
  var viewer = document.getElementById('viewer');
  var vtitle = document.getElementById('vtitle');
  var vprev = document.getElementById('vprev');
  var vnext = document.getElementById('vnext');
  var lastFocus = null;
  var pushed = false;

  function paintViewer(i) {
    vtitle.innerHTML = GAMES[i].name + '<small>게임 룰 ' + (i + 1) + ' / ' + GAMES.length + '</small>';
    dots.forEach(function (d, n) { d.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    vprev.classList.toggle('is-off', i === 0);
    vnext.classList.toggle('is-off', i === GAMES.length - 1);
    loadRule(i);
  }

  var rules = new Swiper('#rules', {
    speed: 380,
    threshold: 8,
    zoom: { maxRatio: 4, toggle: true },
    keyboard: { enabled: false },
    a11y: { enabled: true, slideRole: 'group' },
    on: { slideChange: function () { paintViewer(this.activeIndex); } }
  });

  function openViewer(i) {
    lastFocus = document.activeElement;
    loadRule(i);
    viewer.classList.add('open');
    document.getElementById('vclose').focus();
    rules.update();
    rules.slideTo(i, 0);
    paintViewer(i);
    deck.allowTouchMove = false;
    if (history.pushState) { history.pushState({ rule: true }, ''); pushed = true; }
  }

  function closeViewer(fromPop) {
    if (!viewer.classList.contains('open')) return;
    viewer.classList.remove('open');
    if (rules.zoom) rules.zoom.out();
    deck.allowTouchMove = true;
    if (lastFocus) lastFocus.focus();
    if (pushed && !fromPop && history.state && history.state.rule) history.back();
    pushed = false;
  }

  document.getElementById('vclose').addEventListener('click', function () { closeViewer(false); });
  vprev.addEventListener('click', function () { rules.slidePrev(); });
  vnext.addEventListener('click', function () { rules.slideNext(); });
  window.addEventListener('popstate', function () { closeViewer(true); });

  window.addEventListener('keydown', function (e) {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(false); }
    if (e.key === 'ArrowRight') { e.preventDefault(); rules.slideNext(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); rules.slidePrev(); }
  });

  /* 이미지가 아닌 배경을 누르면 닫기 */
  viewer.addEventListener('click', function (e) {
    if (e.target.classList.contains('swiper-slide') || e.target.classList.contains('swiper-zoom-container')) {
      closeViewer(false);
    }
  });
})();
</script>
</body>
</html>

<link rel="stylesheet" href="assets/swiper.min.css">
<style>
:root{
  --ground:#e9edf4;
  --ground-2:#f6f8fb;

  --line:#d8e0ed;
  --head:#132455;
  --ink-2:#4f5f80;
  --ink-3:#8593ae;
  --blue-deep:#1d3a7d;
  --blue:#2f6bc0;
  --red:#c8202f;
  --scrim:rgba(246,248,251,.9);
  --shadow:0 2px 8px rgba(19,36,85,.10), 0 18px 46px rgba(19,36,85,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080c17; --ground-2:#0d1322; --card:#121a2e; --line:#26314f;
    --head:#e8eefb; --ink-2:#a2b0cf; --ink-3:#6f7d9e;
    --blue-deep:#8fb8f0; --blue:#6fa2e8; --red:#f0616f;

    --shadow:0 2px 8px rgba(0,0,0,.5), 0 18px 46px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#080c17; --ground-2:#0d1322; --card:#121a2e; --line:#26314f;
  --head:#e8eefb; --ink-2:#a2b0cf; --ink-3:#6f7d9e;
  --blue-deep:#8fb8f0; --blue:#6fa2e8; --red:#f0616f;
  --scrim:rgba(10,15,28,.9);
  --shadow:0 2px 8px rgba(0,0,0,.5), 0 18px 46px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--ground); color:var(--head);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 40% at 3% -8%, rgba(200,32,47,.12) 0%, transparent 60%),
    radial-gradient(64% 44% at 103% 106%, rgba(47,107,192,.14) 0%, transparent 58%),
    linear-gradient(162deg, var(--ground-2) 0%, var(--ground) 58%, var(--ground-2) 100%);
}

/* ---------------- deck ---------------- */
.deck{position:relative; z-index:1; width:100%; height:100dvh;}
.deck > .swiper-wrapper > .swiper-slide{
  height:100dvh; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 14px calc(env(safe-area-inset-bottom,0px) + 84px);
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.deck > .swiper-wrapper > .swiper-slide::-webkit-scrollbar{width:6px;}
.deck > .swiper-wrapper > .swiper-slide::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}

/* overflow 를 열어두어야 부스 링의 바깥 광선이 카드 모서리에서 잘리지 않습니다.
   모서리 둥글리기는 이미지 자체에 겁니다. */
.sheet{
  position:relative; flex:none; width:100%; max-width:520px;
  border-radius:14px; background:var(--card);
  box-shadow:var(--shadow); line-height:0;
}
.sheet img{display:block; width:100%; height:auto; border-radius:14px;}

@media (min-width:900px){
  .deck > .swiper-wrapper > .swiper-slide{
    justify-content:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 76px); padding-bottom:100px;
  }
  .sheet{width:auto; max-width:none;}
  .sheet img{width:auto; height:auto; max-height:calc(100dvh - 190px); max-width:92vw;}
}

/* ---------------- 배치도 위의 터치 영역 ---------------- */
.spot{
  position:absolute; appearance:none; border:0; padding:0; margin:0;
  background:transparent; border-radius:50%; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* 이미지가 아직 없는 부스는 아예 나타나지 않습니다 */
.spot[hidden]{display:none !important;}
/* 원 밖으로 살짝 넓힌 실제 터치 범위 (눈에는 안 보임) */
.spot::before{content:""; position:absolute; inset:-4% -14%;}
.spot.sm::before{inset:-24% -12%;}
/* 누를 수 있다는 표시 — 원 둘레를 감싸는 흰 링 */
.spot::after{
  content:""; position:absolute; inset:-6%; border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 16px 2px rgba(255,255,255,.45);
}
.spot.sm::after{inset:-8%; box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 0 12px 2px rgba(255,255,255,.5);}
@media (prefers-reduced-motion: no-preference){
  .spot::after{animation:ringPulse 2.8s ease-in-out infinite;}
  @keyframes ringPulse{0%,66%,100%{opacity:.3} 82%{opacity:1}}
}
@media (prefers-reduced-motion: reduce){ .spot::after{opacity:.55;} }
.spot:hover::after,
.spot:active::after{animation:none; opacity:1;}
.spot:active{transform:scale(.94);}
.spot:focus-visible{outline:3px solid #fff; outline-offset:4px;}

/* ---------------- chrome ---------------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:20;
  height:calc(env(safe-area-inset-top,0px) + 50px);
  padding:env(safe-area-inset-top,0px) 16px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--scrim); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.mark{display:flex; align-items:baseline; gap:7px; min-width:0;}
.mark b{font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--red);}
.mark span{font-size:14px; font-weight:800; letter-spacing:-.02em; color:var(--head); white-space:nowrap;}
.bar-right{display:flex; align-items:center; gap:10px;}
.counter{font-size:13px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.counter em{font-style:normal; color:var(--head);}
.iconbtn{
  appearance:none; width:32px; height:32px; border-radius:9px; cursor:pointer; padding:0;
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center;
}
.iconbtn:hover{color:var(--head);}
.iconbtn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
.iconbtn svg{width:16px; height:16px; fill:currentColor;}
.iconbtn .moon{display:none;}
:root[data-theme="dark"] .iconbtn .moon{display:block;}
:root[data-theme="dark"] .iconbtn .sun{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .iconbtn .moon{display:block;}
  :root:not([data-theme="light"]) .iconbtn .sun{display:none;}
}

.rail{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 11px);
  background:var(--scrim); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line); display:flex; gap:6px;
}
.lane{
  flex:1 1 0; min-width:0; appearance:none; border:0; cursor:pointer; font-family:inherit;
  background:transparent; padding:5px 2px 4px; border-radius:9px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.lane .bar{width:100%; height:4px; border-radius:99px; background:var(--line); transition:background .28s, transform .28s;}
.lane .lbl{font-size:11px; font-weight:700; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; transition:color .28s;}
.lane[aria-current="true"] .bar{background:linear-gradient(90deg,var(--blue-deep),var(--red)); transform:scaleY(1.6);}
.lane[aria-current="true"] .lbl{color:var(--head);}
.lane:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
@media (min-width:900px){
  .rail{justify-content:center; gap:10px; padding:10px 20px 13px;}
  .lane{flex:0 1 160px;}
  .lane .lbl{font-size:12px;}
}

.nav{
  position:fixed; top:50%; z-index:20; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; padding:0;
  border:1px solid var(--line); background:var(--card); color:var(--head);
  cursor:pointer; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.nav svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.nav:focus-visible{outline:2px solid var(--blue); outline-offset:3px;}
.nav.is-off{opacity:.28; pointer-events:none;}
.nav.prev{left:18px;} .nav.next{right:18px;}
@media (min-width:900px){ .nav{display:flex;} }

/* ---------------- 안내 카드 뷰어 ---------------- */
.viewer{
  position:fixed; inset:0; z-index:60; display:none;
  background:rgba(9,12,20,.96);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.viewer.open{display:block;}
.viewer-top{
  position:absolute; top:0; left:0; right:0; z-index:2;

  padding:env(safe-area-inset-top,0px) 14px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;

}
.viewer-title{font-size:15px; font-weight:800; color:#fff; letter-spacing:-.02em;}
.viewer-title small{display:block; font-size:11px; font-weight:600; color:rgba(255,255,255,.55); margin-top:2px; letter-spacing:.04em;}
.closebtn{
  appearance:none; width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer; flex:none;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.closebtn:hover{background:rgba(255,255,255,.2);}
.closebtn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
.closebtn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round;}

.cards{width:100%; height:100dvh;}
.cards .swiper-slide{display:flex; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 66px);}
.cards .swiper-zoom-container{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.cards img{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:12px; display:block;}

.viewer-bottom{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex; align-items:center; justify-content:center; gap:9px;
  background:linear-gradient(0deg, rgba(9,12,20,.92) 40%, transparent);
}
.viewer-bottom:empty{display:none;}
.dot{
  appearance:none; border:0; padding:0; cursor:pointer;
  width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3);
  transition:background .2s, width .2s;
}
.dot[aria-current="true"]{background:#fff; width:22px; border-radius:99px;}
.dot:focus-visible{outline:2px solid #fff; outline-offset:3px;}

.vnav{
  position:absolute; top:50%; z-index:2; transform:translateY(-50%);
  width:42px; height:42px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); color:#fff;
  display:none; align-items:center; justify-content:center;
}
.vnav svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.vnav:hover{background:rgba(255,255,255,.2);}
.vnav.is-off{opacity:.25; pointer-events:none;}
.vnav.hide{display:none !important;}
.vnav.prev{left:16px;} .vnav.next{right:16px;}
@media (min-width:900px){ .vnav{display:flex;} }

/* 여러 장짜리 부스는 손으로 넘기라고 알려줍니다 */
.swipehint{
  position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 52px);
  transform:translateX(-50%); z-index:2;

@media (prefers-reduced-motion: no-preference){
  .swipehint svg{animation:nudge 1.8s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
}

    { no: 2, name: '구속 측정소',       img: 'images/rule-3.jpg', top: 54.4, bottom: 60.6 },
    { no: 3, name: '탄성한계 측정실험', img: 'images/rule-4.jpg', top: 60.6, bottom: 66.8 },
    { no: 4, name: '홀인원 토공사',     img: 'images/rule-5.jpg', top: 68.5, bottom: 74.6 },
    { no: 5, name: '토목철인 3종',      img: 'images/rule-2.jpg', top: 74.7, bottom: 80.8 },
    { no: 6, name: '인간 항타기',       img: 'images/rule-6.jpg', top: 80.9, bottom: 87.0 }
  ];

  /* =====================================================================
     ③  배치도 오른쪽 세로줄 + 위쪽 가로줄 — 부스 소개

     imgs 에 여러 장을 넣으면 그 부스 안에서만 좌우로 넘어갑니다.
     (다른 부스로는 넘어가지 않습니다 — 서로 다른 부스니까요)
     장수를 늘리려면 imgs 에 파일명을 추가하면 됩니다.
     ===================================================================== */
  var COL_R = { left: 87.8, right: 98.7 };

  var BOOTHS = [
    /* 오른쪽 세로줄 (위 → 아래) */
    { name: '협찬 2', left: COL_R.left, right: COL_R.right, top: 48.2, bottom: 54.4,
      imgs: ['images/card-sponsor-2.jpg'] },
    { name: '협찬 1', left: COL_R.left, right: COL_R.right, top: 54.4, bottom: 60.6,
      imgs: ['images/card-sponsor-1.jpg'] },
    { name: '배팅 부스', left: COL_R.left, right: COL_R.right, top: 60.6, bottom: 66.8,
      imgs: ['images/card-betting-1.jpg', 'images/card-betting-2.jpg'] },
    { name: '이음 기자단', left: COL_R.left, right: COL_R.right, top: 68.5, bottom: 74.6,
      imgs: ['images/card-ieum-1.jpg', 'images/card-ieum-2.jpg',
             'images/card-ieum-3.jpg', 'images/card-ieum-4.jpg'] },
    { name: '코나시', left: COL_R.left, right: COL_R.right, top: 74.7, bottom: 80.8,
      imgs: ['images/card-konasi-1.jpg', 'images/card-konasi-2.jpg', 'images/card-konasi-3.jpg'] },
    { name: '서울대', left: COL_R.left, right: COL_R.right, top: 80.9, bottom: 87.0,
      imgs: ['images/card-snu-1.jpg', 'images/card-snu-2.jpg', 'images/card-snu-3.jpg'] },

    /* 위쪽 가로줄 — 원이 작아서 sm 표시 */
    { name: '찬조공연', left: 54.4, right: 62.5, top: 48.3, bottom: 53.0, sm: true,
      imgs: ['images/card-show.jpg'] },
    { name: '운영본부', left: 62.7, right: 69.9, top: 48.3, bottom: 53.0, sm: true,
      imgs: ['images/card-hq.jpg'] },
    { name: '물 부스', left: 77.8, right: 85.4, top: 48.3, bottom: 53.0, sm: true,
      imgs: ['images/card-water.jpg'] }

    /* 내빈석도 넣고 싶으면 아래 줄의 주석을 풀고 이미지를 올리면 됩니다.
    ,{ name: '내빈석', left: 70.1, right: 77.6, top: 48.3, bottom: 53.0, sm: true,
       imgs: ['images/card-guest.jpg'] }
    */
  ];

  /* ===================== 여기부터는 건드릴 일이 없습니다 ===================== */

  function exists(src) {
    return new Promise(function (res) {
      var im = new Image();
      im.onload = function () { res(true); };
      im.onerror = function () { res(false); };
      im.src = src;
    });
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  /* ---------- 밝은/어두운 화면 ---------- */
  var THEME_KEY = 'tomok2026-theme';
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  var deckwrap = document.getElementById('deckwrap');
  var rail = document.getElementById('rail');
  var cur = document.getElementById('cur');
  var total = document.getElementById('total');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var deck, lanes = [];

  /* ---------- 면 만들기 ---------- */
  Promise.all(PANELS.map(function (p) { return exists(p.img); })).then(function (ok) {
    var panels = PANELS.filter(function (p, i) { return ok[i]; });
    if (!panels.length) return;

    deckwrap.innerHTML = panels.map(function (p) {
      return '<section class="swiper-slide" aria-label="' + esc(p.label) + '">' +
             '<div class="sheet"' + (p.map ? ' id="mapsheet"' : '') + '>' +
             '<img src="' + esc(p.img) + '" alt="' + esc(p.alt || p.label) + '" decoding="async">' +
             '</div></section>';
    }).join('');

    rail.innerHTML = panels.map(function (p) {
      return '<button class="lane" type="button">' +
             '<span class="bar"></span><span class="lbl">' + esc(p.label) + '</span></button>';
    }).join('');
    lanes = [].slice.call(rail.children);
    total.textContent = panels.length;

    var start = 0;
    var m = /^#p([1-9])$/.exec(location.hash);
    if (m && +m[1] <= panels.length) start = +m[1] - 1;

    deck = new Swiper('#deck', {
      initialSlide: start,
      speed: 440,
      threshold: 10,
      touchAngle: 32,
      touchReleaseOnEdges: true,
      resistanceRatio: 0.55,
      keyboard: { enabled: true, onlyInViewport: false },
      a11y: { enabled: true, containerMessage: '토목체전 안내', slideRole: 'group' },
      on: {
        init: function () { paintDeck(this.activeIndex); },
        slideChange: function () { paintDeck(this.activeIndex); }
      }
    });
    deck.on('slideChangeTransitionEnd', function () {
      var el = deck.slides[deck.previousIndex];
      if (el) el.scrollTop = 0;
    });

    lanes.forEach(function (l, i) { l.addEventListener('click', function () { deck.slideTo(i); }); });
    prev.addEventListener('click', function () { deck.slidePrev(); });
    next.addEventListener('click', function () { deck.slideNext(); });

    if (document.getElementById('mapsheet')) buildSpots();
  });

  function paintDeck(i) {
    cur.textContent = i + 1;
    lanes.forEach(function (l, n) { l.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    prev.classList.toggle('is-off', i === 0);
    next.classList.toggle('is-off', i === lanes.length - 1);
  }

  /* ---------- 배치도 위의 터치 영역 ---------- */
  function buildSpots() {
    var mapsheet = document.getElementById('mapsheet');

    function place(item, onOpen) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'spot' + (item.sm ? ' sm' : '');
      el.style.left = item.left + '%';
      el.style.width = (item.right - item.left) + '%';
      el.style.top = item.top + '%';
      el.style.height = (item.bottom - item.top) + '%';
      el.setAttribute('aria-label', item.name + ' 안내 보기');
      el.hidden = true;
      el.addEventListener('click', onOpen);
      mapsheet.appendChild(el);
      return el;
    }

    /* 게임 부스 — 이미지가 있는 것만 켜고, 게임끼리 좌우로 넘어갑니다 */
    GAMES.forEach(function (g) {
      g.el = place(g, function () {
        var ready = GAMES.filter(function (x) { return x.ready; });
        openViewer(ready.map(function (x) {
          return { name: x.name, sub: '부스 ' + x.no + ' · 게임 룰', img: x.img };
        }), ready.indexOf(g));
      });
      exists(g.img).then(function (ok) { g.ready = ok; if (ok) g.el.hidden = false; });
    });

    /* 그 밖의 부스 — 그 부스가 가진 장수만큼만 넘어갑니다 */
    BOOTHS.forEach(function (b) {
      b.el = place(b, function () {
        openViewer(b.list.map(function (src, n) {
          return {
            name: b.name,
            sub: b.list.length > 1 ? (n + 1) + ' / ' + b.list.length : '부스 안내',
            img: src
          };
        }), 0);
      });
      Promise.all(b.imgs.map(exists)).then(function (ok) {
        b.list = b.imgs.filter(function (src, i) { return ok[i]; });
        if (b.list.length) b.el.hidden = false;
      });
    });
  }

  /* ---------- 안내 카드 뷰어 ---------- */
  var viewer = document.getElementById('viewer');
  var vtitle = document.getElementById('vtitle');
  var vprev = document.getElementById('vprev');
  var vnext = document.getElementById('vnext');
  var dotwrap = document.getElementById('vdots');
  var swipehint = document.getElementById('swipehint');
  var list = [];
  var lastFocus = null;
  var pushed = false;

  var cards = new Swiper('#cards', {
    speed: 380,
    threshold: 8,
    zoom: { maxRatio: 4, toggle: true },
    keyboard: { enabled: false },
    a11y: { enabled: true, slideRole: 'group' },
    on: { slideChange: function () { paintViewer(this.activeIndex); } }
  });

  function paintViewer(i) {
    var it = list[i];
    if (!it) return;
    vtitle.innerHTML = esc(it.name) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '');
    [].slice.call(dotwrap.children).forEach(function (d, n) {
      d.setAttribute('aria-current', n === i ? 'true' : 'false');
    });
    vprev.classList.toggle('is-off', i === 0);
    vnext.classList.toggle('is-off', i === list.length - 1);
    swipehint.hidden = !(list.length > 1 && i === 0);
  }

  function openViewer(items, index) {
    if (!items.length || index < 0) return;
    list = items;

    cards.removeAllSlides();
    cards.appendSlide(items.map(function (it) {
      return '<div class="swiper-slide"><div class="swiper-zoom-container">' +
             '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + ' 안내" decoding="async">' +
             '</div></div>';
    }));

    dotwrap.innerHTML = '';
    if (items.length > 1) {
      items.forEach(function (it, n) {
        var d = document.createElement('button');
        d.type = 'button';
        d.className = 'dot';
        d.setAttribute('aria-label', it.name + ' ' + (n + 1));
        d.addEventListener('click', function () { cards.slideTo(n); });
        dotwrap.appendChild(d);
      });
    }
    vprev.classList.toggle('hide', items.length < 2);
    vnext.classList.toggle('hide', items.length < 2);

    lastFocus = document.activeElement;
    viewer.classList.add('open');
    document.getElementById('vclose').focus();
    cards.update();
    cards.slideTo(index, 0);
    paintViewer(index);
    if (deck) deck.allowTouchMove = false;
    if (history.pushState) { history.pushState({ card: true }, ''); pushed = true; }
  }

  function closeViewer(fromPop) {
    if (!viewer.classList.contains('open')) return;
    viewer.classList.remove('open');
    if (cards.zoom) cards.zoom.out();
    if (deck) deck.allowTouchMove = true;
    if (lastFocus) lastFocus.focus();
    if (pushed && !fromPop && history.state && history.state.card) history.back();
    pushed = false;
  }

  document.getElementById('vclose').addEventListener('click', function () { closeViewer(false); });
  vprev.addEventListener('click', function () { cards.slidePrev(); });
  vnext.addEventListener('click', function () { cards.slideNext(); });
  window.addEventListener('popstate', function () { closeViewer(true); });

  window.addEventListener('keydown', function (e) {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(false); }
    if (e.key === 'ArrowRight') { e.preventDefault(); cards.slideNext(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); cards.slidePrev(); }
  });

  viewer.addEventListener('click', function (e) {
    if (e.target.classList.contains('swiper-slide') || e.target.classList.contains('swiper-zoom-container')) {
      closeViewer(false);
    }
  });
})();
</script>
</body>
</html>
